name: flutter_contacts
description: "Fast, complete contact management for iOS & macOS — all fields, groups, accounts, vCards, native dialogs, and listeners."
version: 2.0.1
repository: https://github.com/GoHighLevel/flutter_contacts

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      # android:
      #   package: co.quis.flutter_contacts
      #   pluginClass: FlutterContactsPlugin
      ios:
        pluginClass: FlutterContactsPlugin
      macos:
        pluginClass: FlutterContactsPlugin
